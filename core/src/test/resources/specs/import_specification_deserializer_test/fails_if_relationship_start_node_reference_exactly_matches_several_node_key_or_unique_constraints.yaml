---
version: '1'
sources:
- name: a-source
  type: jdbc
  data_source: a-data-source
  sql: SELECT id FROM my.table
targets:
  nodes:
  - name: a-node-target
    source: a-source
    labels:
    - Person
    - Employee
    properties:
    - source_field: id
      target_property: id
    schema:
      key_constraints:
      - name: person-id-key
        label: Person
        properties:
        - id
      - name: employee-id-key
        label: Employee
        properties:
        - id
  relationships:
  - name: a-relationship-target
    source: a-source
    type: TYPE
    write_mode: create
    start_node_reference:
      name: a-node-target
      key_mappings:
      - source_field: source_id
        node_property: id
    end_node_reference: a-node-target
